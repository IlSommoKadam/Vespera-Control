plugins {
    id 'com.android.application'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.vaonis.vesperacontrol'
    compileSdk 35

    defaultConfig {
        applicationId "com.vaonis.vesperacontrol"
        minSdk 29
        targetSdk 35
        versionCode 45
        versionName "0.2.42"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'commons-net:commons-net:3.11.1'
}

def apkShareDir = file('C:/WORK/ESA/Share/pub')

tasks.register('publishReleaseApkToShare', Copy) {
    from(layout.buildDirectory.file('outputs/apk/release/app-release.apk'))
    into(apkShareDir)
    rename { 'VesperaControl.apk' }
    doFirst {
        apkShareDir.mkdirs()
    }
    def publishedVersion = android.defaultConfig.versionName
    def publishedCode = android.defaultConfig.versionCode
    doLast {
        def manifest = new File(apkShareDir, 'vesperacontrol-version.json')
        manifest.setText("""\
{
  "name": "VesperaControl",
  "version": "${publishedVersion}",
  "versionCode": ${publishedCode},
  "apk": "VesperaControl.apk",
  "source": "mega"
}
""", 'UTF-8')
    }
}

afterEvaluate {
    tasks.named('assembleRelease').configure {
        finalizedBy 'publishReleaseApkToShare'
    }
}
